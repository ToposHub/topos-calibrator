[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topos-calibrator"
version = "0.1.0-preview"
description = "Professional display calibration and measurement software"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Topos Calibrator Team"}
]
keywords = ["calibration", "display", "color", "argyll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "PyQt6>=6.5.0",
    "PyQt6-WebEngine>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pytest-xvfb>=3.0.0",
    "pytest-timeout>=2.3.1",
]
macos = [
    "pyobjc-core>=9.0",
    "pyobjc-framework-Cocoa>=9.0",
    "pyobjc-framework-Quartz>=9.0",
]

[project.scripts]
topos-calibrator = "main:main"

[project.urls]
Homepage = "https://github.com/ToposHub/topos-calibrator"
Documentation = "https://github.com/ToposHub/topos-calibrator#readme"
Repository = "https://github.com/ToposHub/topos-calibrator.git"

# ========== Pytest 配置 ==========
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    # 测试分层 markers（用于 CI 分阶段执行）
    "unit: 不依赖 GUI/硬件/打包的快速单元测试",
    "workflow: fake adapter 下跑 workflow 测试",
    "integration: 可依赖 Argyll fake 或本机工具的集成测试",
    "package: 依赖 dist app 的打包测试",
    "hardware: 真实设备手动/实验室执行测试",
    # 兼容旧 markers
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests requiring GUI/display",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ========== Ruff 配置 (可选) ==========
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "ArgyllCMS",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "B904",  # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ========== MyPy 配置 (可选) ==========
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "ArgyllCMS",
    "build",
    "dist",
]

# ========== Coverage 配置 ==========
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

# ========== Setuptools 配置 ==========
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
