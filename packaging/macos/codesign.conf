# Topos Calibrator macOS 代码签名配置
# ======================================
# 
# 此文件包含代码签名和公证的配置参数。
# 实际签名应在 CI/CD 或打包脚本中执行。
#
# 使用方法：
#   source packaging/macos/codesign.conf
#   codesign --sign "$SIGNING_IDENTITY" ...

# ========== 签名身份 ==========
# Developer ID Application 证书
# 从 Apple Developer 获取
# 示例: "Developer ID Application: Your Name (TEAM_ID)"
SIGNING_IDENTITY="${CODESIGN_IDENTITY:-}"

# 团队 ID
TEAM_ID="${APPLE_TEAM_ID:-}"

# ========== 应用信息 ==========
APP_NAME="Topos Calibrator"
APP_BUNDLE="Topos Calibrator.app"
BUNDLE_ID="com.toposcalibrator.app"

# ========== 签名选项 ==========
# 签名时使用的选项
CODESIGN_OPTIONS="--options runtime"
# --options runtime: 启用强化运行时（公证要求）

# 签名深度
CODESIGN_DEPTH="--deep"

# 强制签名（覆盖已有签名）
CODESIGN_FORCE="--force"

# 验证签名
CODESIGN_VERIFY="--verify --verbose"

# ========== 权限文件 ==========
ENTITLEMENTS_FILE="packaging/macos/entitlements.plist"
INFO_PLIST_FILE="packaging/macos/Info.plist"

# ========== 签名命令模板 ==========
# 签名 app bundle
sign_app() {
    local app_path="$1"
    
    if [ -z "$SIGNING_IDENTITY" ]; then
        echo "警告: 未设置签名身份，跳过签名"
        return 1
    fi
    
    echo "正在签名: $app_path"
    
    codesign $CODESIGN_FORCE $CODESIGN_DEPTH $CODESIGN_VERIFY \
        --sign "$SIGNING_IDENTITY" \
        $CODESIGN_OPTIONS \
        --entitlements "$ENTITLEMENTS_FILE" \
        --timestamp \
        "$app_path"
    
    if [ $? -eq 0 ]; then
        echo "签名成功"
        return 0
    else
        echo "签名失败"
        return 1
    fi
}

# 验证签名
verify_signature() {
    local app_path="$1"
    
    echo "验证签名: $app_path"
    
    codesign $CODESIGN_VERIFY "$app_path"
    
    if [ $? -eq 0 ]; then
        echo "签名验证通过"
        spctl -a -t vv -vv "$app_path"
        return 0
    else
        echo "签名验证失败"
        return 1
    fi
}

# ========== 公证配置 ==========
# 公证需要 Apple ID 和 App-Specific Password
# 在 CI/CD 中设置 NOTARYTOOL_PASSWORD 环境变量

NOTARY_APPLE_ID="${NOTARY_APPLE_ID:-}"
NOTARY_TEAM_ID="${NOTARY_TEAM_ID:-$TEAM_ID}"

# 公证命令模板
notarize_app() {
    local app_path="$1"
    local zip_path="${app_path%.app}.zip"
    
    echo "创建 zip 文件: $zip_path"
    ditto -c -k --keepParent "$app_path" "$zip_path"
    
    echo "提交公证..."
    xcrun notarytool submit "$zip_path" \
        --apple-id "$NOTARY_APPLE_ID" \
        --password "@env:NOTARYTOOL_PASSWORD" \
        --team-id "$NOTARY_TEAM_ID" \
        --wait
    
    if [ $? -eq 0 ]; then
        echo "公证成功"
        
        # Staple 公证票据
        xcrun stapler staple "$app_path"
        
        # 清理 zip
        rm "$zip_path"
        
        return 0
    else
        echo "公证失败"
        return 1
    fi
}

# ========== 输出配置摘要 ==========
echo "Topos Calibrator macOS 代码签名配置"
echo "===================================="
echo "应用名称: $APP_NAME"
echo "Bundle ID: $BUNDLE_ID"
echo "签名身份: ${SIGNING_IDENTITY:-未设置}"
echo "团队 ID: ${TEAM_ID:-未设置}"