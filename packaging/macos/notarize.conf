# ========== 公证票据检查 ==========
#
# 用户可以通过以下命令验证公证:
# spctl -a -t vv -vv /Applications/Topos\ Calibrator.app
#
# 应该显示:
# "source=Notarized Developer ID"

# ========== 豁免和例外 ==========
#
# 如果无法公证，可以告知用户:
# 1. 右键点击应用，选择"打开"
# 2. 在安全警告中点击"打开"
# 3. 或在系统偏好设置 > 安全性与隐私中允许
#
# 不建议这种方式，因为用户可能会遇到困难。
# 最好的解决方案是完成 Apple 公证流程。