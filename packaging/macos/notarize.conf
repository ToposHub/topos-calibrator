# Topos Calibrator macOS 公证配置
# ===================================
#
# 此文件包含 Apple 公证相关配置。
# 公证是 macOS 10.15+ 分发应用的必要步骤。
#
# 参考文档:
# https://developer.apple.com/documentation/security/notarizing_macos_software_before_distribution

# ========== 公证要求 ==========
# 
# 1. Developer ID Application 证书
#    - 从 Apple Developer 获取
#    - 需要付费开发者账户 ($99/年)
#
# 2. App-Specific Password
#    - 从 appleid.apple.com 生成
#    - 用于 notarytool API 认证
#
# 3. 强化运行时 (Hardened Runtime)
#    - 签名时使用 --options runtime
#    - 需要正确配置 entitlements
#
# 4. 代码签名
#    - 所有可执行文件必须签名
#    - 所有动态库必须签名

# ========== 公证流程 ==========
#
# 1. 构建应用
#    pyinstaller packaging/pyinstaller.spec
#
# 2. 签名应用
#    codesign --deep --force --sign "$IDENTITY" \
#      --options runtime \
#      --entitlements packaging/macos/entitlements.plist \
#      dist/Topos\ Calibrator.app
#
# 3. 创建 zip
#    ditto -c -k --keepParent dist/Topos\ Calibrator.app dist/ToposCalibrator.zip
#
# 4. 提交公证
#    xcrun notarytool submit dist/ToposCalibrator.zip \
#      --apple-id "$APPLE_ID" \
#      --password "$APP_SPECIFIC_PASSWORD" \
#      --team-id "$TEAM_ID" \
#      --wait
#
# 5. Staple 公证票据
#    xcrun stapler staple dist/Topos\ Calibrator.app
#
# 6. 验证
#    spctl -a -t vv -vv dist/Topos\ Calibrator.app

# ========== 常见问题 ==========
#
# Q: 公证失败 "The signature of the binary is invalid"
# A: 检查所有可执行文件是否都已签名，包括 PyInstaller 打包的
#    第三方库中的可执行文件。
#
# Q: 公证失败 "The executable does not have the hardened runtime flag"
# A: 确保签名时使用 --options runtime
#
# Q: 公证失败 "The binary is not signed with a valid Developer ID certificate"
# A: 确保使用 Developer ID Application 证书，而不是 Development 证书
#
# Q: 公证失败 "The app links to frameworks that are not signed"
# A: 检查所有动态库是否已签名，可能需要对第三方库进行 ad-hoc 签名
#
# Q: USB 设备无法访问
# A: 确保 entitlements.plist 包含 com.apple.security.device.usb
#    并且应用已正确签名

