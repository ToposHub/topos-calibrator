# Topos Calibrator Linux AppImage 配置
# ====================================
#
# 此文件定义 AppImage 打包参数。
# 使用 linuxdeploy 工具创建 AppImage。
#
# 参考: https://github.com/linuxdeploy/linuxdeploy

[AppImage]
# 输出文件名
output_filename = ToposCalibrator-x86_64.AppImage

# 应用名称
app_name = topos-calibrator

# AppDir 跷径（PyInstaller 输出目录）
appdir = dist/topos-calibrator

[Desktop]
# .desktop 文件
desktop_file = packaging/linux/topos-calibrator.desktop

# 图标文件
icon_file = packaging/linux/ToposCalibrator.png

[AppDir]
# AppDir 结构配置
# 符合 AppImage spec: https://github.com/AppImage/AppImageSpec

# 主程序位置
main_executable = usr/bin/topos-calibrator

# 资源文件
resources = [
    "usr/share/applications/topos-calibrator.desktop",
    "usr/share/icons/hicolor/*/apps/ToposCalibrator.png",
    "usr/share/mime/packages/topos-calibrator.xml",
]

# Qt 插件
qt_plugins = [
    "platforms",
    "platformthemes",
    "imageformats",
    "iconengines",
    "xcbglintegrations",
    "webengine",
]

[Dependencies]
# 需要的运行时依赖
# 这些库会被打包到 AppImage 中

libraries = [
    "libQt6Core.so.6",
    "libQt6Gui.so.6",
    "libQt6Widgets.so.6",
    "libQt6WebEngineCore.so.6",
    "libQt6WebEngineWidgets.so.6",
    "libQt6DBus.so.6",
    "libQt6XcbQpa.so.6",
    "libQt6WaylandClient.so.6",
]

# 系统依赖（不打包，假设系统有）
exclude_libraries = [
    "libc.so.6",
    "libm.so.6",
    "libdl.so.2",
    "libpthread.so.0",
    "libstdc++.so.6",
    "libgcc_s.so.1",
]

[Environment]
# AppImage 内置环境变量

QT_QPA_PLATFORM = xcb
QTWEBENGINE_REMOTE_DEBUGGING = 9222
QTWEBENGINE_CHROMIUM_FLAGS = --disable-gpu-sandbox

[MIME]
# 自定义 MIME 类型

[application/x-topos-calibrator-measurement]
comment = Topos Calibrator Measurement Data
comment[zh_CN] = Topos Calibrator 测量数据
glob-pattern = *.tcm
icon = ToposCalibrator

[application/x-argyll-ti3]
comment = ArgyllCMS TI3 Measurement File
comment[zh_CN] = ArgyllCMS TI3 测量文件
glob-pattern = *.ti3
icon = ToposCalibrator

[application/x-icc-profile]
comment = ICC Color Profile
comment[zh_CN] = ICC 颜色配置文件
glob-pattern = *.icc;*.icm
icon = ToposCalibrator

[Permissions]
# Linux 特定权限说明

i2c-dev = "DDC/CI 显示器控制（需要 chmod 666 /dev/i2c-*）"
usb-hid = "校色仪通信（可能需要 udev 规则）"
x11-display = "色块窗口显示（X11）"
wayland-display = "色块窗口显示（Wayland，可能受限）"

[X11]
# X11 特定配置
# X11 是推荐的显示环境

preferred = true
features = [
    "全屏色块窗口支持",
    "多显示器支持",
    "显卡 LUT 操作 (dispwin)",
]

[Wayland]
# Wayland 特定配置
# Wayland 有一定限制

preferred = false
features = [
    "基本色块窗口支持",
]
limitations = [
    "部分 Wayland compositor 限制全屏窗口",
    "Wayland protocol 安全限制可能影响色块显示",
    "建议使用 XWayland 环境",
]